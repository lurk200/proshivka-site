# nginx → Node (vite preview) для proshivka.online
# SSL подключает certbot (deploy/remote-bootstrap.sh)

upstream proshivka_app {
    server 127.0.0.1:5174;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name proshivka.online www.proshivka.online;

    client_max_body_size 16m;

    location / {
        proxy_pass http://proshivka_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
